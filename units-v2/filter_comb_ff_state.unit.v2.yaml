kind: apg.unit
schema: apg.unit.v2
name: filter_comb_ff_state
version: 2.0.0

meta:
  title: Feedforward Comb Filter State
  category: filter
  description: Exercises deterministic comb-filter delay memory and reset behavior.

params:
  delay_samples:
    type: int
    default: 2
    min: 1
    max: 32
  coefficient:
    type: float
    default: 0.5
    min: -1.0
    max: 1.0

ports:
  inputs:
    - name: input
      type: audio
      channels: 1
  outputs:
    - name: output
      type: audio
      channels: 1

graph:
  signals:
    - input
    - output

  nodes:
    - id: comb
      atom: filter_comb_ff
      in:
        signal: input
      out:
        signal: output
      config:
        delay_samples: ${params.delay_samples}
        coefficient: ${params.coefficient}

compatibility:
  desktop_full: true
  offline_render: true
