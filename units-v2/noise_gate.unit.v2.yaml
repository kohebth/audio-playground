kind: apg.unit
schema: apg.unit.v2
name: noise_gate
version: 2.0.0

meta:
  title: Noise Gate
  category: dynamics
  description: Opens a gate when the mono input crosses a threshold and mutes lower samples.

params:
  threshold:
    type: float
    default: 0.2
    min: 0.0
    max: 1.0
    smoothing_ms: 5
    ui:
      label: Threshold
      control: knob
      unit: x
      scale: linear
      display_precision: 2

ports:
  inputs:
    - name: input
      type: audio
      channels: 1
  outputs:
    - name: output
      type: audio
      channels: 1

graph:
  signals:
    - input
    - gate
    - output

  nodes:
    - id: threshold_detect
      atom: detect_threshold
      in:
        signal: input
      out:
        gate: gate
      config:
        threshold: ${params.threshold}

    - id: apply_gate
      atom: amplitude_multiply
      in:
        signal_a: input
        signal_b: gate
      out:
        signal: output

compatibility:
  desktop_full: true
  wasm_realtime: true
  m7_static: true
  offline_render: true
