name: Scheduled Browser Performance

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache

      - name: Build and smoke-test WASM middleware
        run: |
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm --target apg_control apg_processor -j2
          node apg-wasm/test/emscripten_runtime_smoke.mjs build/wasm/apg-wasm .
          mkdir -p browser-wasm
          cp build/wasm/apg-wasm/apg_control.mjs build/wasm/apg-wasm/apg_control.wasm browser-wasm/
          cp build/wasm/apg-wasm/apg_processor.mjs build/wasm/apg-wasm/apg_processor.wasm browser-wasm/
          cp apg-wasm/web/processor.worklet.js browser-wasm/processor.worklet.js

      - name: Upload WASM middleware
        uses: actions/upload-artifact@v4
        with:
          name: browser-wasm
          path: browser-wasm
          retention-days: 14

  browser:
    needs: wasm
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: chromium-full
            browser: chromium
            project: chromium
            cpu: 1
            memory: 0
            full: true
          - profile: chromium-4x
            browser: chromium
            project: chromium
            cpu: 4
            memory: 0
            full: false
          - profile: chromium-6x
            browser: chromium
            project: chromium
            cpu: 6
            memory: 0
            full: false
          - profile: chromium-mobile-6x
            browser: chromium
            project: chromium-mobile
            cpu: 6
            memory: 0
            full: false
          - profile: chromium-memory-256mb
            browser: chromium
            project: chromium
            cpu: 1
            memory: 256
            full: false
          - profile: firefox-medium
            browser: firefox
            project: firefox
            cpu: 1
            memory: 0
            full: false
          - profile: webkit-medium
            browser: webkit
            project: webkit
            cpu: 1
            memory: 0
            full: false
    env:
      APG_BROWSER_MATRIX: '1'
      APG_CPU_THROTTLE: ${{ matrix.cpu }}
      APG_MEMORY_LIMIT_MB: ${{ matrix.memory }}
      APG_PERF_BROWSER: ${{ matrix.project }}
      APG_PERF_PROFILE: ${{ matrix.profile }}
      APG_PERF_SCHEDULED: '1'
      PLAYWRIGHT_JSON_OUTPUT_NAME: perf-results-${{ matrix.profile }}.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apg-web/package-lock.json

      - name: Download WASM middleware
        uses: actions/download-artifact@v4
        with:
          name: browser-wasm
          path: apg-web/public/wasm

      - name: Install web editor dependencies
        working-directory: apg-web
        run: npm install

      - name: Install browser
        working-directory: apg-web
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Restore rolling browser baseline
        uses: actions/cache/restore@v4
        with:
          path: apg-web/perf-history/rolling/${{ matrix.profile }}.json
          key: browser-perf-${{ runner.os }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            browser-perf-${{ runner.os }}-${{ matrix.profile }}-

      - name: Run full scheduled Chromium suite
        if: matrix.full
        working-directory: apg-web
        run: npm run perf:ui -- --project=${{ matrix.project }} --reporter=line,json --workers=1

      - name: Run throttled or cross-browser medium suite
        if: matrix.full == false
        working-directory: apg-web
        run: npm run perf:ui -- --project=${{ matrix.project }} --grep @browser-matrix --reporter=line,json --workers=1

      - name: Create trend record
        if: always()
        working-directory: web-tools
        run: npm run perf:ui:report -- --input perf-results-${{ matrix.profile }}.json --output perf-history/${{ matrix.profile }}.json

      - name: Update rolling baseline and chart
        if: success()
        working-directory: web-tools
        run: >-
          npm run perf:ui:baseline --
          --input perf-history/${{ matrix.profile }}.json
          --previous perf-history/rolling/${{ matrix.profile }}.json
          --output perf-history/rolling/${{ matrix.profile }}.json
          --chart perf-history/${{ matrix.profile }}.html
          --max-samples 12

      - name: Save rolling browser baseline
        if: success()
        uses: actions/cache/save@v4
        with:
          path: web-tools/perf-history/rolling/${{ matrix.profile }}.json
          key: browser-perf-${{ runner.os }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload browser performance history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-perf-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web-tools/perf-results-${{ matrix.profile }}.json
            web-tools/perf-history/${{ matrix.profile }}.json
            web-tools/perf-history/rolling/${{ matrix.profile }}.json
            web-tools/perf-history/${{ matrix.profile }}.html
            web-tools/test-results/perf-ui
          if-no-files-found: warn
          retention-days: 90
