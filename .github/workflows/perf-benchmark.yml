name: Unit Editor Performance Baseline

on:
  pull_request:
    paths:
      - 'apg-web/**'
      - 'apg-wasm/**'
      - 'src/**'
      - 'inc/**'
      - 'CMakeLists.txt'
      - '.github/workflows/perf-benchmark.yml'
      - 'test/fixtures/projects-v2/perf/**'
      - 'test/fixtures/units-v2/**'
      - 'test/golden/v2-inspect-atoms.json'
      - 'test/golden/v2-inspect-atoms.manifest.txt'
  push:
    tags:
      - 'v2.0-beta[0-9]+'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apg-web/package-lock.json

      - name: Install web editor dependencies
        working-directory: apg-web
        run: npm install

      - name: Performance regression check
        working-directory: apg-web
        run: npm run perf:benchmark:ci

  browser-medium:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apg-wasm/package-lock.json
            apg-web/package-lock.json

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache

      - name: Build and smoke-test WASM middleware
        run: |
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm --target apg_control apg_processor -j2
          node apg-wasm/test/emscripten_runtime_smoke.mjs build/wasm/apg-wasm .
          mkdir -p apg-web/public/wasm
          cp build/wasm/apg-wasm/apg_control.mjs build/wasm/apg-wasm/apg_control.wasm apg-web/public/wasm/
          cp build/wasm/apg-wasm/apg_processor.mjs build/wasm/apg-wasm/apg_processor.wasm apg-web/public/wasm/
          cp apg-wasm/web/processor.worklet.js apg-web/public/wasm/processor.worklet.js

      - name: Build WASM web facade
        working-directory: apg-wasm
        run: npm install && npm run build

      - name: Install web editor dependencies
        working-directory: apg-web
        run: npm install

      - name: Install Chromium
        working-directory: apg-web
        run: npx playwright install --with-deps chromium

      - name: Medium browser performance gate
        working-directory: apg-web
        run: npm run perf:ui:pr
