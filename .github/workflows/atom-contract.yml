name: Atom Contract

on:
  push:
    tags:
      - 'v2.0-beta[0-9]+'
  pull_request:
    paths:
      - 'apg-core/inc/atom/**'
      - 'apg-core/inc/apgcore/dsp/**'
      - 'apg-core/inc/rte/atom_registry.h'
      - 'apg-core/src/atom/**'
      - 'apg-core/src/rte/atom_register.c'
      - 'test/test_atom_basic*.c'
      - 'test/test_atom_catalog.c'
      - 'test/test_atom_registry_contract.c'
      - 'CMakeLists.txt'
      - '.github/workflows/atom-contract.yml'

jobs:
  atom-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: cmake -S . -B build -DAPG_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build atom tests
        run: cmake --build build --target test_atom_basic test_atom_catalog test_atom_registry_contract --parallel

      - name: Run atom contract tests
        run: ctest --test-dir build -R 'test_atom_basic|test_atom_catalog|test_atom_registry_contract' --output-on-failure
