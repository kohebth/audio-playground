name: marshall_4x12_greenback_cabinet
version: 1.0.0
params:
  resonance:
    default: 0.32
  body:
    default: 0.55
  air:
    default: 0.22
  level:
    default: 0.8
signals:
  - input
  - output
  - cab_low_cut
  - body_120
  - body_190
  - cone_280
  - body_sum_a
  - body_sum_b
  - body_gain
  - body_signal
  - cone_filter
  - greenback_rolloff
  - air_path
  - air_gain
  - air_signal
  - mic_sum
  - phase_smear
  - level_val
pipeline:
  # Closed-back 4x12 low cut: removes sub-bass before speaker resonances.
  - id: cab_low_cut
    fn: filter_biquad
    out:
      signal: cab_low_cut
    in:
      signal: input
    config:
      b0: 0.88
      b1: -0.88
      b2: 0.0
      a1: -0.76
      a2: 0.0

  # Short feed-forward combs approximate four speakers, box reflections, and mic distance.
  - id: cab_body_120hz
    fn: filter_comb_ff
    out:
      signal: body_120
    in:
      signal: cab_low_cut
    config:
      delay_samples: 400
      coefficient: ${params.resonance}

  - id: cab_body_190hz
    fn: filter_comb_ff
    out:
      signal: body_190
    in:
      signal: cab_low_cut
    config:
      delay_samples: 253
      coefficient: 0.24

  - id: cab_cone_280hz
    fn: filter_comb_ff
    out:
      signal: cone_280
    in:
      signal: cab_low_cut
    config:
      delay_samples: 171
      coefficient: -0.18

  - id: sum_body_a
    fn: amplitude_add
    out:
      signal: body_sum_a
    in:
      signal_a: body_120
      signal_b: body_190

  - id: sum_body_b
    fn: amplitude_add
    out:
      signal: body_sum_b
    in:
      signal_a: body_sum_a
      signal_b: cone_280

  - id: body_amount
    fn: generation_dc
    out:
      signal: body_gain
    config:
      value: ${params.body}

  - id: apply_body
    fn: amplitude_multiply
    out:
      signal: body_signal
    in:
      signal_a: body_sum_b
      signal_b: body_gain

  # Greenback-style cone curve: forward mids with a firm rolloff above the fizz band.
  - id: greenback_mid_focus
    fn: filter_biquad
    out:
      signal: cone_filter
    in:
      signal: body_signal
    config:
      b0: 0.64
      b1: -0.16
      b2: -0.20
      a1: -0.30
      a2: 0.10

  - id: greenback_top_rolloff
    fn: filter_biquad
    out:
      signal: greenback_rolloff
    in:
      signal: cone_filter
    config:
      b0: 0.30
      b1: 0.28
      b2: 0.08
      a1: -0.30
      a2: 0.06

  - id: air_filter
    fn: filter_biquad
    out:
      signal: air_path
    in:
      signal: cab_low_cut
    config:
      b0: 0.36
      b1: -0.36
      b2: 0.0
      a1: -0.24
      a2: 0.0

  - id: air_amount
    fn: generation_dc
    out:
      signal: air_gain
    config:
      value: ${params.air}

  - id: apply_air
    fn: amplitude_multiply
    out:
      signal: air_signal
    in:
      signal_a: air_path
      signal_b: air_gain

  - id: mic_blend
    fn: amplitude_add
    out:
      signal: mic_sum
    in:
      signal_a: greenback_rolloff
      signal_b: air_signal

  - id: cab_phase_smear
    fn: filter_allpass
    out:
      signal: phase_smear
    in:
      signal: mic_sum
    config:
      delay_samples: 37
      coefficient: 0.42

  - id: output_level
    fn: generation_dc
    out:
      signal: level_val
    config:
      value: ${params.level}

  - id: apply_level
    fn: amplitude_multiply
    out:
      signal: output
    in:
      signal_a: phase_smear
      signal_b: level_val
