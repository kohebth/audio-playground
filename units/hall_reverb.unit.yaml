name: hall_reverb
version: 2.0.0
params:
  mix:
    default: 0.5
    range:
      - 0
      - 1
  decay:
    default: 0.8
    range:
      - 0.5
      - 0.95
  diffusion:
    default: 0.7
    range:
      - 0.5
      - 0.85
  size:
    default: 1
    range:
      - 0.7
      - 1.5
  pre_delay_ms:
    default: 30
    range:
      - 0
      - 100
  modulation_depth:
    default: 4
    range:
      - 0
      - 10
  modulation_rate:
    default: 0.4
    range:
      - 0.1
      - 2
  er_level:
    default: 0.5
    range:
      - 0
      - 1
  tail_level:
    default: 0.7
    range:
      - 0
      - 1
signals:
  - input
  - input_scaled
  - pre_delayed
  - er_tap1
  - er_tap2
  - er_tap3
  - er_tap4
  - er_tap1_scaled
  - er_tap2_scaled
  - er_tap3_scaled
  - er_tap4_scaled
  - er_sum_a
  - er_sum_b
  - er_sum
  - er_out
  - c1_raw
  - c1_damped
  - c2_raw
  - c2_damped
  - c3_raw
  - c3_damped
  - c4_raw
  - c4_damped
  - c5_raw
  - c5_damped
  - c6_raw
  - c6_damped
  - c7_raw
  - c7_damped
  - c8_raw
  - c8_damped
  - sum_12
  - sum_34
  - sum_56
  - sum_78
  - sum_1234
  - sum_5678
  - comb_mix_raw
  - comb_mix
  - comb_scale
  - ap1_out
  - ap2_out
  - ap3_out
  - ap4_out
  - ap5_out
  - ap6_out
  - tail_scaled
  - er_contribution
  - reverb
  - output
pipeline:
  - id: input_scaler_dc
    fn: generation_dc
    out:
      signal: input_scale_const
    config:
      value: 0.3
  - id: scale_input
    fn: amplitude_multiply
    out:
      signal: input_scaled
    in:
      signal_a: input
      signal_b: input_scale_const
  - id: pre_delay
    fn: delay_line
    out:
      signal: pre_delayed
    in:
      signal: input_scaled
    config:
      length: 1440
  - id: er_tap_1
    fn: delay_line
    out:
      signal: er_tap1
    in:
      signal: input_scaled
    config:
      length: 877
  - id: er_tap_2
    fn: delay_line
    out:
      signal: er_tap2
    in:
      signal: input_scaled
    config:
      length: 1153
  - id: er_tap_3
    fn: delay_line
    out:
      signal: er_tap3
    in:
      signal: input_scaled
    config:
      length: 1559
  - id: er_tap_4
    fn: delay_line
    out:
      signal: er_tap4
    in:
      signal: input_scaled
    config:
      length: 2161
  - id: er_gain_1
    fn: generation_dc
    out:
      signal: er_g1
    config:
      value: 0.7
  - id: er_gain_2
    fn: generation_dc
    out:
      signal: er_g2
    config:
      value: 0.55
  - id: er_gain_3
    fn: generation_dc
    out:
      signal: er_g3
    config:
      value: 0.4
  - id: er_gain_4
    fn: generation_dc
    out:
      signal: er_g4
    config:
      value: 0.3
  - id: er_scale_1
    fn: amplitude_multiply
    out:
      signal: er_tap1_scaled
    in:
      signal_a: er_tap1
      signal_b: er_g1
  - id: er_scale_2
    fn: amplitude_multiply
    out:
      signal: er_tap2_scaled
    in:
      signal_a: er_tap2
      signal_b: er_g2
  - id: er_scale_3
    fn: amplitude_multiply
    out:
      signal: er_tap3_scaled
    in:
      signal_a: er_tap3
      signal_b: er_g3
  - id: er_scale_4
    fn: amplitude_multiply
    out:
      signal: er_tap4_scaled
    in:
      signal_a: er_tap4
      signal_b: er_g4
  - id: er_add_a
    fn: amplitude_add
    out:
      signal: er_sum_a
    in:
      signal_a: er_tap1_scaled
      signal_b: er_tap2_scaled
  - id: er_add_b
    fn: amplitude_add
    out:
      signal: er_sum_b
    in:
      signal_a: er_tap3_scaled
      signal_b: er_tap4_scaled
  - id: er_add_total
    fn: amplitude_add
    out:
      signal: er_out
    in:
      signal_a: er_sum_a
      signal_b: er_sum_b
  - id: comb_1
    fn: filter_comb_fb
    out:
      signal: c1_raw
    in:
      signal: pre_delayed
    config:
      delay_samples: 2999
      coefficient: ${params.decay}
  - id: comb_1_damp
    fn: filter_biquad
    out:
      signal: c1_damped
    in:
      signal: c1_raw
    config:
      b0: 0.06049834399121229
      b1: 0.12099668798242458
      b2: 0.06049834399121229
      a1: -1.1939101383572974
      a2: 0.4359035143221464
  - id: comb_2
    fn: filter_comb_fb
    out:
      signal: c2_raw
    in:
      signal: pre_delayed
    config:
      delay_samples: 3119
      coefficient: 0.84
  - id: comb_2_damp
    fn: filter_biquad
    out:
      signal: c2_damped
    in:
      signal: c2_raw
    config:
      b0: 0.06049834399121229
      b1: 0.12099668798242458
      b2: 0.06049834399121229
      a1: -1.1939101383572974
      a2: 0.4359035143221464
  - id: comb_3
    fn: filter_comb_fb
    out:
      signal: c3_raw
    in:
      signal: pre_delayed
    config:
      delay_samples: 3257
      coefficient: 0.83
  - id: comb_3_damp
    fn: filter_biquad
    out:
      signal: c3_damped
    in:
      signal: c3_raw
    config:
      b0: 0.06049834399121229
      b1: 0.12099668798242458
      b2: 0.06049834399121229
      a1: -1.1939101383572974
      a2: 0.4359035143221464
  - id: comb_4
    fn: filter_comb_fb
    out:
      signal: c4_raw
    in:
      signal: pre_delayed
    config:
      delay_samples: 3413
      coefficient: 0.82
  - id: comb_4_damp
    fn: filter_biquad
    out:
      signal: c4_damped
    in:
      signal: c4_raw
    config:
      b0: 0.06049834399121229
      b1: 0.12099668798242458
      b2: 0.06049834399121229
      a1: -1.1939101383572974
      a2: 0.4359035143221464
  - id: comb_5
    fn: filter_comb_fb
    out:
      signal: c5_raw
    in:
      signal: pre_delayed
    config:
      delay_samples: 3571
      coefficient: 0.81
  - id: comb_5_damp
    fn: filter_biquad
    out:
      signal: c5_damped
    in:
      signal: c5_raw
    config:
      b0: 0.06049834399121229
      b1: 0.12099668798242458
      b2: 0.06049834399121229
      a1: -1.1939101383572974
      a2: 0.4359035143221464
  - id: comb_6
    fn: filter_comb_fb
    out:
      signal: c6_raw
    in:
      signal: pre_delayed
    config:
      delay_samples: 3719
      coefficient: 0.8
  - id: comb_6_damp
    fn: filter_biquad
    out:
      signal: c6_damped
    in:
      signal: c6_raw
    config:
      b0: 0.06049834399121229
      b1: 0.12099668798242458
      b2: 0.06049834399121229
      a1: -1.1939101383572974
      a2: 0.4359035143221464
  - id: comb_7
    fn: filter_comb_fb
    out:
      signal: c7_raw
    in:
      signal: pre_delayed
    config:
      delay_samples: 3851
      coefficient: 0.79
  - id: comb_7_damp
    fn: filter_biquad
    out:
      signal: c7_damped
    in:
      signal: c7_raw
    config:
      b0: 0.06049834399121229
      b1: 0.12099668798242458
      b2: 0.06049834399121229
      a1: -1.1939101383572974
      a2: 0.4359035143221464
  - id: comb_8
    fn: filter_comb_fb
    out:
      signal: c8_raw
    in:
      signal: pre_delayed
    config:
      delay_samples: 3989
      coefficient: 0.78
  - id: comb_8_damp
    fn: filter_biquad
    out:
      signal: c8_damped
    in:
      signal: c8_raw
    config:
      b0: 0.06049834399121229
      b1: 0.12099668798242458
      b2: 0.06049834399121229
      a1: -1.1939101383572974
      a2: 0.4359035143221464
  - id: add_12
    fn: amplitude_add
    out:
      signal: sum_12
    in:
      signal_a: c1_damped
      signal_b: c2_damped
  - id: add_34
    fn: amplitude_add
    out:
      signal: sum_34
    in:
      signal_a: c3_damped
      signal_b: c4_damped
  - id: add_56
    fn: amplitude_add
    out:
      signal: sum_56
    in:
      signal_a: c5_damped
      signal_b: c6_damped
  - id: add_78
    fn: amplitude_add
    out:
      signal: sum_78
    in:
      signal_a: c7_damped
      signal_b: c8_damped
  - id: add_1234
    fn: amplitude_add
    out:
      signal: sum_1234
    in:
      signal_a: sum_12
      signal_b: sum_34
  - id: add_5678
    fn: amplitude_add
    out:
      signal: sum_5678
    in:
      signal_a: sum_56
      signal_b: sum_78
  - id: add_all
    fn: amplitude_add
    out:
      signal: comb_mix_raw
    in:
      signal_a: sum_1234
      signal_b: sum_5678
  - id: comb_norm_dc
    fn: generation_dc
    out:
      signal: comb_scale
    config:
      value: 0.125
  - id: normalize_combs
    fn: amplitude_multiply
    out:
      signal: comb_mix
    in:
      signal_a: comb_mix_raw
      signal_b: comb_scale
  - id: ap_1
    fn: filter_allpass
    out:
      signal: ap1_out
    in:
      signal: comb_mix
    config:
      delay_samples: 113
      coefficient: ${params.diffusion}
  - id: ap_2
    fn: filter_allpass
    out:
      signal: ap2_out
    in:
      signal: ap1_out
    config:
      delay_samples: 173
      coefficient: ${params.diffusion}
  - id: ap_3
    fn: filter_allpass
    out:
      signal: ap3_out
    in:
      signal: ap2_out
    config:
      delay_samples: 269
      coefficient: 0.65
  - id: ap_4
    fn: filter_allpass
    out:
      signal: ap4_out
    in:
      signal: ap3_out
    config:
      delay_samples: 379
      coefficient: 0.65
  - id: ap_5
    fn: filter_allpass
    out:
      signal: ap5_out
    in:
      signal: ap4_out
    config:
      delay_samples: 547
      coefficient: 0.6
  - id: ap_6
    fn: filter_allpass
    out:
      signal: ap6_out
    in:
      signal: ap5_out
    config:
      delay_samples: 661
      coefficient: 0.6
  - id: er_level_dc
    fn: generation_dc
    out:
      signal: er_level_const
    config:
      value: ${params.er_level}
  - id: scale_er
    fn: amplitude_multiply
    out:
      signal: er_contribution
    in:
      signal_a: er_out
      signal_b: er_level_const
  - id: step_54
    fn: amplitude_add
    out:
      signal: reverb
    in:
      signal_a: er_contribution
      signal_b: ap6_out
  - id: final_mix
    fn: mix_wet_dry
    out:
      signal: output
    in:
      dry: input
      wet: reverb
    config:
      mix: ${params.mix}