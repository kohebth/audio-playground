name: marshall_plexi_head_amp
version: 1.0.0
params:
  input_gain:
    default: 7.0
  bright:
    default: 0.35
  presence:
    default: 0.45
  master:
    default: 0.65
signals:
  - input
  - output
  - bright_path
  - bright_gain
  - bright_signal
  - jumped_input
  - gain_val
  - preamp_drive
  - stage1_clip
  - stage1_trim_val
  - stage1_trimmed
  - low_cut
  - stage2_drive_val
  - stage2_drive
  - stage2_clip
  - mid_scoop
  - presence_path
  - presence_gain
  - presence_signal
  - tone_sum
  - treble_tamed
  - master_val
pipeline:
  # Bright channel feed: a thin upper-mid branch mixed before the first gain stage.
  - id: bright_filter
    fn: filter_biquad
    out:
      signal: bright_path
    in:
      signal: input
    config:
      b0: 0.55
      b1: -0.55
      b2: 0.0
      a1: -0.62
      a2: 0.0

  - id: bright_amount
    fn: generation_dc
    out:
      signal: bright_gain
    config:
      value: ${params.bright}

  - id: apply_bright
    fn: amplitude_multiply
    out:
      signal: bright_signal
    in:
      signal_a: bright_path
      signal_b: bright_gain

  - id: jump_channels
    fn: amplitude_add
    out:
      signal: jumped_input
    in:
      signal_a: input
      signal_b: bright_signal

  # Cascaded Plexi-style gain: loud, open, and not as compressed as a modern high-gain amp.
  - id: input_gain
    fn: generation_dc
    out:
      signal: gain_val
    config:
      value: ${params.input_gain}

  - id: drive_stage1
    fn: amplitude_multiply
    out:
      signal: preamp_drive
    in:
      signal_a: jumped_input
      signal_b: gain_val

  - id: clip_stage1
    fn: amplitude_clip_soft
    out:
      signal: stage1_clip
    in:
      signal: preamp_drive
    config:
      threshold: 0.85
      curve: 1

  - id: stage1_makeup
    fn: generation_dc
    out:
      signal: stage1_trim_val
    config:
      value: 0.55

  - id: trim_stage1
    fn: amplitude_multiply
    out:
      signal: stage1_trimmed
    in:
      signal_a: stage1_clip
      signal_b: stage1_trim_val

  - id: low_cut
    fn: filter_biquad
    out:
      signal: low_cut
    in:
      signal: stage1_trimmed
    config:
      b0: 0.82
      b1: -0.82
      b2: 0.0
      a1: -0.68
      a2: 0.0

  - id: stage2_gain
    fn: generation_dc
    out:
      signal: stage2_drive_val
    config:
      value: 2.4

  - id: drive_stage2
    fn: amplitude_multiply
    out:
      signal: stage2_drive
    in:
      signal_a: low_cut
      signal_b: stage2_drive_val

  - id: clip_stage2
    fn: amplitude_clip_soft
    out:
      signal: stage2_clip
    in:
      signal: stage2_drive
    config:
      threshold: 0.75
      curve: 0

  # Simple tone stack approximation: low-end tightening, mid scoop, presence branch, treble rolloff.
  - id: plexi_mid_scoop
    fn: filter_biquad
    out:
      signal: mid_scoop
    in:
      signal: stage2_clip
    config:
      b0: 0.78
      b1: -0.48
      b2: 0.18
      a1: -0.42
      a2: 0.14

  - id: presence_filter
    fn: filter_biquad
    out:
      signal: presence_path
    in:
      signal: stage2_clip
    config:
      b0: 0.46
      b1: -0.46
      b2: 0.0
      a1: -0.38
      a2: 0.0

  - id: presence_amount
    fn: generation_dc
    out:
      signal: presence_gain
    config:
      value: ${params.presence}

  - id: apply_presence
    fn: amplitude_multiply
    out:
      signal: presence_signal
    in:
      signal_a: presence_path
      signal_b: presence_gain

  - id: add_presence
    fn: amplitude_add
    out:
      signal: tone_sum
    in:
      signal_a: mid_scoop
      signal_b: presence_signal

  - id: treble_tamer
    fn: filter_biquad
    out:
      signal: treble_tamed
    in:
      signal: tone_sum
    config:
      b0: 0.36
      b1: 0.30
      b2: 0.08
      a1: -0.24
      a2: 0.05

  - id: master_level
    fn: generation_dc
    out:
      signal: master_val
    config:
      value: ${params.master}

  - id: apply_master
    fn: amplitude_multiply
    out:
      signal: output
    in:
      signal_a: treble_tamed
      signal_b: master_val
