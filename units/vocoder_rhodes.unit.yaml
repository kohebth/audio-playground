name: rhodes_c4_attack_unit
version: 0.1.1
params:
  threshold:
    default: 0.005
  decay_time:
    default: 0.25
signals:
  - input
  - output
  - env
  - slope
  - trigger_gate
  - amp_env
  - freq_c4
  - osc_main
  - osc_mod
  - tine_core
  - tine_shaped
  - attack_click
  - final_signal
pipeline:
  - id: env_detect
    fn: detect_envelope
    out:
      envelope: env
    in:
      signal: input
    config:
      attack: 0.001
      release: 0.05
      sample_rate: 48000
  - id: slope_detect
    fn: detect_slope
    out:
      signal: slope
    in:
      signal: env
  - id: threshold
    fn: detect_threshold
    out:
      gate: trigger_gate
    in:
      signal: slope
    config:
      threshold: ${params.threshold}
  - id: amp_env_gen
    fn: generation_envelope
    out:
      signal: amp_env
    in:
      gate: trigger_gate
    config:
      attack: 0.002
      decay: ${params.decay_time}
      sustain: 0.25
      release: 0.25
      sample_rate: 48000
  - id: freq
    fn: generation_dc
    out:
      signal: freq_c4
    config:
      value: 261.63
  - id: osc_main_gen
    fn: generation_oscillator
    out:
      signal: osc_main
    in:
      frequency: freq_c4
    config:
      waveform: 0
      sample_rate: 48000
  - id: osc_mod_gen
    fn: generation_oscillator
    out:
      signal: osc_mod
    in:
      frequency: freq_c4
    config:
      waveform: 2
      phase_offset: 0.25
      sample_rate: 48000
  - id: ring_mod
    fn: modulation_ring
    out:
      signal: tine_core
    in:
      signal: osc_main
      carrier: osc_mod
  - id: apply_env
    fn: amplitude_multiply
    out:
      signal: tine_shaped
    in:
      signal_a: tine_core
      signal_b: amp_env
  - id: attack_click_shape
    fn: amplitude_multiply
    out:
      signal: attack_click
    in:
      signal_a: slope
      signal_b: amp_env
  - id: mix
    fn: amplitude_add
    out:
      signal: final_signal
    in:
      signal_a: tine_shaped
      signal_b: attack_click
  - id: tone_filter
    fn: filter_biquad
    out:
      signal: output
    in:
      signal: final_signal
    config:
      b0: 0.4
      b1: 0.3
      b2: 0
      a1: -0.3
      a2: 0
