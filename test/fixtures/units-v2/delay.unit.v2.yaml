kind: apg.unit
schema: apg.unit.v2
name: delay
version: 2.0.0

meta:
  title: Delay
  category: delay
  description: Mixes mono dry input with a stateful delayed signal.

params:
  time_samples:
    type: int
    default: 2
    min: 0
    max: 48000
    ui:
      label: Time
      control: slider
      unit: samples
      scale: linear
      display_precision: 0
  mix:
    type: float
    default: 0.35
    min: 0.0
    max: 1.0
    smoothing_ms: 10
    ui:
      label: Mix
      control: knob
      unit: "%"
      scale: linear
      display_precision: 2

ports:
  inputs:
    - name: input
      type: audio
      channels: 1
  outputs:
    - name: output
      type: audio
      channels: 1

graph:
  signals:
    - input
    - delayed
    - output

  nodes:
    - id: delay_line
      atom: delay_line
      in:
        signal: input
      out:
        signal: delayed
      config:
        length: ${params.time_samples}

    - id: blend_delay
      atom: mix_wet_dry
      in:
        dry: input
        wet: delayed
      out:
        signal: output
      config:
        mix: ${params.mix}

compatibility:
  desktop_full: true
  wasm_realtime: true
  m7_static: true
  offline_render: true
