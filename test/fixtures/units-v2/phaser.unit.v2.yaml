kind: apg.unit
schema: apg.unit.v2
name: phaser
version: 2.0.0

meta:
  title: Phaser
  category: modulation
  description: Sweeps six first-order all-pass stages to create resonant moving notches.

params:
  rate:
    type: float
    default: 0.5
    min: 0.05
    max: 5.0
    smoothing_ms: 10
    ui:
      label: Rate
      control: knob
      unit: Hz
      scale: log
      display_precision: 2
  depth:
    type: float
    default: 0.7
    min: 0.0
    max: 1.0
    smoothing_ms: 10
    ui:
      label: Depth
      control: knob
      unit: "%"
      scale: linear
      display_precision: 2
  center:
    type: float
    default: 900.0
    min: 100.0
    max: 4000.0
    smoothing_ms: 10
    ui:
      label: Center
      control: knob
      unit: Hz
      scale: log
      display_precision: 0
  feedback:
    type: float
    default: 0.2
    min: -0.85
    max: 0.85
    smoothing_ms: 10
    ui:
      label: Resonance
      control: knob
      unit: "%"
      scale: linear
      display_precision: 2
  mix:
    type: float
    default: 0.5
    min: 0.0
    max: 1.0
    smoothing_ms: 10
    ui:
      label: Mix
      control: knob
      unit: "%"
      scale: linear
      display_precision: 2

ports:
  inputs:
    - name: input
      type: audio
      channels: 1
  outputs:
    - name: output
      type: audio
      channels: 1

graph:
  signals:
    - input
    - lfo
    - wet
    - output

  nodes:
    - id: lfo
      atom: generation_lfo
      out:
        signal: lfo
      config:
        frequency: ${params.rate}
        waveform: 0
        phase_offset: 0.0

    - id: allpass_sweep
      atom: modulation_phaser
      in:
        signal: input
        modulator: lfo
      out:
        signal: wet
      config:
        center_frequency: ${params.center}
        depth: ${params.depth}
        feedback: ${params.feedback}

    - id: blend
      atom: mix_wet_dry
      in:
        dry: input
        wet: wet
      out:
        signal: output
      config:
        mix: ${params.mix}

compatibility:
  desktop_full: true
  wasm_realtime: true
  m7_static: true
  offline_render: true
