kind: apg.unit
schema: apg.unit.v2
name: simple_mix
version: 2.0.0

meta:
  title: Simple Mix
  category: utility
  unit_family: utility
  description: Adds two mono audio inputs into one mono output.

params:
  trim:
    type: float
    default: 1.0
    min: 0.0
    max: 1.0

ports:
  inputs:
    - name: a
      type: audio
      channels: 1
    - name: b
      type: audio
      channels: 1
  outputs:
    - name: output
      type: audio
      channels: 1

graph:
  signals:
    - a
    - b
    - output

  nodes:
    - id: add_inputs
      atom: amplitude_add
      in:
        signal_a: a
        signal_b: b
      out:
        signal: output

compatibility:
  desktop_full: true
  wasm_realtime: true
  offline_render: true
