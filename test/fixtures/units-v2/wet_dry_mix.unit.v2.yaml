kind: apg.unit
schema: apg.unit.v2
name: wet_dry_mix
version: 2.0.0

meta:
  title: Wet/Dry Mix
  category: mix
  description: Blends separate dry and wet mono inputs with a smoothed mix control.

params:
  mix:
    type: float
    default: 0.5
    min: 0.0
    max: 1.0
    smoothing_ms: 10
    ui:
      label: Mix
      control: knob
      unit: "%"
      scale: linear
      display_precision: 2

ports:
  inputs:
    - name: dry
      type: audio
      channels: 1
    - name: wet
      type: audio
      channels: 1
  outputs:
    - name: output
      type: audio
      channels: 1

graph:
  signals:
    - dry
    - wet
    - output

  nodes:
    - id: blend
      atom: mix_wet_dry
      in:
        dry: dry
        wet: wet
      out:
        signal: output
      config:
        mix: ${params.mix}

compatibility:
  desktop_full: true
  wasm_realtime: true
  m7_static: true
  offline_render: true
