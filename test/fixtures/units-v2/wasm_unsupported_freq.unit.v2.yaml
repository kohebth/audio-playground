kind: apg.unit
schema: apg.unit.v2
name: wasm_unsupported_freq
version: 2.0.0

meta:
  title: WASM Unsupported Frequency
  category: test
  description: Exercises wasm_realtime atom-profile rejection for frequency-domain atoms.

params: {}

ports:
  inputs:
    - name: input
      type: audio
      channels: 1
  outputs:
    - name: real
      type: audio
      channels: 1

graph:
  signals:
    - input
    - real
    - imag

  nodes:
    - id: fft
      atom: freq_fft
      in:
        signal: input
      out:
        real: real
        imag: imag
      config:
        block_size: 64

compatibility:
  desktop_full: true
  wasm_realtime: true
  offline_render: true
