kind: apg.unit
schema: apg.unit.v2
name: control_gain
version: 2.0.0

meta:
  title: Control Gain
  category: utility
  unit_family: utility
  description: Maps a control input port to a gain parameter used by the graph.

params:
  gain:
    type: float
    default: 1.0
    min: 0.0
    max: 4.0

ports:
  inputs:
    - name: input
      type: audio
      channels: 1
    - name: amount
      type: control
      target:
        kind: param
        name: gain
  outputs:
    - name: output
      type: audio
      channels: 1

graph:
  signals:
    - input
    - gain_value
    - output

  nodes:
    - id: gain_value
      atom: generation_dc
      out:
        signal: gain_value
      config:
        value: ${params.gain}

    - id: apply_gain
      atom: amplitude_multiply
      in:
        signal_a: input
        signal_b: gain_value
      out:
        signal: output

compatibility:
  desktop_full: true
  wasm_realtime: true
  offline_render: true
