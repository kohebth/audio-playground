kind: apg.project
schema: apg.project.v2
name: two-gain-chain
version: 2.0.0

units:
  - id: gain_unit
    file: ../units-v2/simple_gain.unit.v2.yaml

chain:
  nodes:
    - id: gain1
      unit: gain_unit
      params:
        gain: 2.0
    - id: gain2
      unit: gain_unit
      params:
        gain: 3.0

  routes:
    - from: system.input
      to: gain1.input
    - from: gain1.output
      to: gain2.input
    - from: gain2.output
      to: system.output

targets:
  default: desktop_full
  export:
    - offline_render
