kind: apg.project
schema: apg.project.v2
name: perf-atoms-medium-branching
version: 2.0.0
units:
  - id: perf_atoms_100_branching
    file: ../../units-v2/perf/perf_atoms_100_branching.unit.v2.yaml
chain:
  nodes:
    - id: atom_stress
      unit: perf_atoms_100_branching
  routes:
    - from: system.input
      to: atom_stress.input
    - from: atom_stress.output
      to: system.output
targets:
  default: desktop_full
  export:
    - wasm_realtime
    - offline_render
meta:
  perf:
    profile: medium
    topology: branching
    target:
      units: 1
      atoms: 100
      routes: 2
