kind: apg.project
schema: apg.project.v2
name: invalid-raw-fanout
version: 2.0.0

units:
  - id: gain_unit
    file: ../units-v2/simple_gain.unit.v2.yaml

chain:
  nodes:
    - id: gain_a
      unit: gain_unit
    - id: gain_b
      unit: gain_unit
  routes:
    - from: system.input
      to: gain_a.input
    - from: system.input
      to: gain_b.input
    - from: gain_a.output
      to: system.output

targets:
  default: desktop_full
