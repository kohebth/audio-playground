kind: apg.project
schema: apg.project.v2
name: guitar-pedalboard
version: 2.1.0

units:
  - id: noise_gate_unit
    file: ../units-v2/noise_gate.unit.v2.yaml
  - id: phaser_unit
    file: ../units-v2/phaser.unit.v2.yaml
  - id: overdrive_unit
    file: ../units-v2/overdrive.unit.v2.yaml
  - id: tone_stack_unit
    file: ../units-v2/tone_stack.unit.v2.yaml
  - id: tremolo_unit
    file: ../units-v2/tremolo.unit.v2.yaml
  - id: chorus_unit
    file: ../units-v2/chorus.unit.v2.yaml
  - id: delay_unit
    file: ../units-v2/delay.unit.v2.yaml
  - id: reverb_unit
    file: ../units-v2/schroeder_reverb.unit.v2.yaml

chain:
  nodes:
    - id: gate1
      unit: noise_gate_unit
      params:
        threshold: 0.15
        attack: 0.005
        release: 0.15
    - id: phaser1
      unit: phaser_unit
      params:
        rate: 0.55
        depth: 0.68
        center: 850.0
        feedback: 0.22
        mix: 0.45
    - id: drive1
      unit: overdrive_unit
      params:
        drive: 2.2
        tone: 0.9
        level: 0.8
    - id: tone1
      unit: tone_stack_unit
      params:
        gain: 1.3
        bass: 0.65
        mid: 0.45
        treble: 0.72
        presence: 0.22
        volume: 0.68
    - id: trem1
      unit: tremolo_unit
      params:
        rate: 4.0
        depth: 0.25
    - id: chorus1
      unit: chorus_unit
      params:
        rate: 0.8
        depth: 384.0
        mix: 0.3
    - id: delay1
      unit: delay_unit
      params:
        time_samples: 12000
        feedback: 0.35
        mix: 0.3
    - id: reverb1
      unit: reverb_unit
      params:
        decay: 0.72
        mix: 0.22

  routes:
    - from: system.input
      to: gate1.input
    - from: gate1.output
      to: phaser1.input
    - from: phaser1.output
      to: drive1.input
    - from: drive1.output
      to: tone1.input
    - from: tone1.output
      to: trem1.input
    - from: trem1.output
      to: chorus1.input
    - from: chorus1.output
      to: delay1.input
    - from: delay1.output
      to: reverb1.input
    - from: reverb1.output
      to: system.output

scenes:
  - name: Clean
    params:
      gate1.threshold: 0.12
      gate1.attack: 0.008
      gate1.release: 0.25
      phaser1.rate: 0.35
      phaser1.depth: 0.55
      phaser1.center: 750.0
      phaser1.feedback: 0.15
      phaser1.mix: 0.32
      drive1.drive: 1.4
      drive1.level: 0.75
      tone1.gain: 0.9
      tone1.bass: 0.75
      tone1.mid: 0.3
      tone1.treble: 0.65
      tone1.presence: 0.15
      tone1.volume: 0.72
      chorus1.rate: 0.65
      chorus1.depth: 320.0
      chorus1.mix: 0.2
      delay1.time_samples: 14400
      delay1.feedback: 0.25
      delay1.mix: 0.15
  - name: Lead
    params:
      gate1.threshold: 0.18
      gate1.attack: 0.003
      gate1.release: 0.12
      phaser1.rate: 0.75
      phaser1.depth: 0.82
      phaser1.center: 1100.0
      phaser1.feedback: 0.42
      phaser1.mix: 0.55
      drive1.drive: 4.5
      drive1.level: 0.9
      tone1.gain: 2.2
      tone1.bass: 0.55
      tone1.mid: 0.65
      tone1.treble: 0.78
      tone1.presence: 0.4
      tone1.volume: 0.75
      chorus1.rate: 1.1
      chorus1.depth: 480.0
      chorus1.mix: 0.3
      delay1.time_samples: 16800
      delay1.feedback: 0.48
      delay1.mix: 0.4
      reverb1.decay: 0.82
      reverb1.mix: 0.28

targets:
  default: desktop_full
  export:
    - wasm_realtime
    - offline_render
