kind: apg.project
schema: apg.project.v2
name: invalid-crossed-routing
version: 2.0.0

units:
  - id: path_panner_2_unit
    file: ../units-v2/path_panner_2.unit.v2.yaml
  - id: path_mixer_2_unit
    file: ../units-v2/path_mixer_2.unit.v2.yaml

chain:
  nodes:
    - id: pan
      unit: path_panner_2_unit
      routing:
        section: parallel_1
    - id: mix
      unit: path_mixer_2_unit
      routing:
        section: parallel_1
  routes:
    - from: system.input
      to: pan.input
    - from: pan.path_1
      to: mix.path_2
    - from: pan.path_2
      to: mix.path_1
    - from: mix.output
      to: system.output

targets:
  default: desktop_full
