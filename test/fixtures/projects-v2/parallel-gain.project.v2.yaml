kind: apg.project
schema: apg.project.v2
name: parallel-gain
version: 2.0.0

units:
  - id: gain_unit
    file: ../units-v2/simple_gain.unit.v2.yaml
  - id: path_panner_2_unit
    file: ../units-v2/path_panner_2.unit.v2.yaml
  - id: path_mixer_2_unit
    file: ../units-v2/path_mixer_2.unit.v2.yaml

chain:
  nodes:
    - id: parallel_pan
      unit: path_panner_2_unit
      routing:
        section: parallel_1
    - id: boost
      unit: gain_unit
      params:
        gain: 2.0
    - id: parallel_mix
      unit: path_mixer_2_unit
      routing:
        section: parallel_1
  routes:
    - from: system.input
      to: parallel_pan.input
    - from: parallel_pan.path_1
      to: parallel_mix.path_1
    - from: parallel_pan.path_2
      to: boost.input
    - from: boost.output
      to: parallel_mix.path_2
    - from: parallel_mix.output
      to: system.output

targets:
  default: desktop_full
  export:
    - wasm_realtime
    - m7_static
    - offline_render
