kind: apg.unit
schema: apg.unit.v2
name: stream_in_fixed_schedule
version: 2.0.0

meta:
  title: Stream Atom In Fixed Schedule
  category: test
  unit_family: utility
  description: Exercises fixed-rate compiler rejection for variable-rate stream atoms.

params: {}

ports:
  inputs:
    - name: input
      type: audio
      channels: 1
  outputs:
    - name: output
      type: audio
      channels: 1

graph:
  signals:
    - input
    - output

  nodes:
    - id: downsample
      atom: src_downsample
      in:
        signal: input
      out:
        signal: output
      config:
        factor: 2

compatibility:
  desktop_full: true
  wasm_realtime: true
  m7_static: true
  offline_render: true
