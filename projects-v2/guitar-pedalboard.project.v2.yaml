kind: apg.project
schema: apg.project.v2
name: guitar-pedalboard
version: 2.0.0

units:
  - id: noise_gate_unit
    file: ../units-v2/noise_gate.unit.v2.yaml
  - id: overdrive_unit
    file: ../units-v2/overdrive.unit.v2.yaml
  - id: tone_stack_unit
    file: ../units-v2/tone_stack.unit.v2.yaml
  - id: tremolo_unit
    file: ../units-v2/tremolo.unit.v2.yaml
  - id: delay_unit
    file: ../units-v2/delay.unit.v2.yaml
  - id: wet_dry_mix_unit
    file: ../units-v2/wet_dry_mix.unit.v2.yaml

chain:
  nodes:
    - id: gate1
      unit: noise_gate_unit
      params:
        threshold: 0.15
    - id: drive1
      unit: overdrive_unit
      params:
        drive: 2.2
        tone: 0.9
        level: 0.8
    - id: tone1
      unit: tone_stack_unit
      params:
        bass: 1.0
        mid: 0.9
        treble: 1.1
    - id: trem1
      unit: tremolo_unit
      params:
        rate: 4.0
        depth: 0.25
    - id: delay1
      unit: delay_unit
      params:
        time_samples: 2
        mix: 0.35
    - id: blend1
      unit: wet_dry_mix_unit
      params:
        mix: 0.25

  routes:
    - from: system.input
      to: gate1.input
    - from: gate1.output
      to: drive1.input
    - from: drive1.output
      to: tone1.input
    - from: tone1.output
      to: trem1.input
    - from: trem1.output
      to: delay1.input
    - from: trem1.output
      to: blend1.dry
    - from: delay1.output
      to: blend1.wet
    - from: blend1.output
      to: system.output

scenes:
  - name: Clean
    params:
      gate1.threshold: 0.12
      drive1.drive: 1.4
      drive1.level: 0.75
      blend1.mix: 0.15
  - name: Lead
    params:
      gate1.threshold: 0.18
      drive1.drive: 4.5
      drive1.level: 0.9
      delay1.mix: 0.45
      blend1.mix: 0.35

targets:
  default: desktop_full
  export:
    - wasm_realtime
    - offline_render
